[project]
name = "article-image-gen"
version = "0.1.0"
description = "Generate original, web-ready illustrations for articles with FLUX (ComfyUI) and a local LLM (Ollama)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "arq>=0.26",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "python-slugify>=8",
    "pyyaml>=6",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-app: &app
  image: article-image-gen-api
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  env_file: .env
  environment:
    COMFYUI_URL: http://comfyui:8188
    OLLAMA_URL: http://ollama:11434
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  depends_on:
    - redis
    - comfyui
    - ollama

services:
  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]

  comfyui:
    <<: *gpu
    image: article-image-gen-comfyui
    build:
      context: .
      dockerfile: docker/comfyui.Dockerfile
    volumes:
      - ./models:/opt/ComfyUI/models
    ports:
      - "127.0.0.1:8188:8188"  # ComfyUI editor, reachable via SSH tunnel only
    restart: unless-stopped

  ollama:
    <<: *gpu
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: unless-stopped

volumes:
  ollama:
  redis:
